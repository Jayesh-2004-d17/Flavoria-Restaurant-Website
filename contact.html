<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">

            <div class="logo">
               <img src="assets/images/logo.png" alt="Flavoria Restaurant">
            </div>

            <input type="checkbox" id="menu-toggle">

            <label for="menu-toggle" class="menu-icon">
                <i class="fa-solid fa-bars"></i>
            </label>

            <nav class="navbar">
                <a href="index.html">HOME</a>
                <a href="about.html">ABOUT</a>
                <a href="gallery.html">GALLERY</a>
                <a href="reservation.html">RESERVATION</a>
                <a href="contact.html">CONTACT</a>
            </nav>

     </header>
    <section class="contact-section">
        
        <div class="contact-container">

            <div class="contact-image">
                 <img src="assets/images/resturant.jpg" alt="Flavoria Restaurant">
            </div>

            <div class="contact-info">
                
                <p class="contact-subtitle">— CONTACT US —</p>

                <h2>Get In Touch</h2>

                

                <div class="contact-box">
                    <i class="fa-solid fa-location-dot"></i>

                    <div>
                        <h3>Address</h3>
                        <p>123, Food Street, Culinary City, India</p>
                    </div>
                </div>

                <div class="contact-box">
                    <i class="fa-solid fa-phone"></i>

                    <div>
                        <h3>Contact</h3>
                        <p>+91 98765 43210</p>
                    </div>
                </div>

                <div class="contact-box">
                    <i class="fa-solid fa-envelope"></i>

                    <div>
                        <h3>Mail ID</h3>
                        <p>hello@flavoria.com</p>
                    </div>
                </div>
            
                <div class="contact-box">
                    <i class="fa-solid fa-clock"></i>

                    <div>
                        <h3>Opening Hours</h3>
                        <p>Mon - Sun: 10:00 AM - 11:00 PM</p>
                    </div>
                </div>


            </div>
        </div>
    </section>
</body>
</html>
